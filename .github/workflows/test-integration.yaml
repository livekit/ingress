name: Integration Test
on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    # Everything the test image is built from. A change to any of these can
    # alter the binary the suite exercises, and a path missing here means no
    # run at all rather than a run that passes.
    paths:
      - .github/workflows/test-integration.yaml
      - .golangci.yaml
      - .go-version
      - .gst-version
      - build/test/**
      - cmd/**
      - pkg/**
      - test/**
      - version/**
      - go.mod
      - go.sum

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    # The suite's own deadline is 20m, so this only catches a hang outside it.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # WHIP is missing on purpose: its publisher is the livekit-whip-bot
        # submodule, which has to be checked out and built into the image first.
        suite: [rtmp, url]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read the pinned GStreamer version
        id: gst-version
        run: |
          version=$(cat .gst-version)
          if [ -z "$version" ]; then echo ".gst-version is empty" >&2; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Write the ${{ matrix.suite }} config
        run: |
          cat > /tmp/ingress-integration.yaml <<EOF
          logging:
            level: debug
          redis:
            address: redis:6379
          api_key: devkey
          api_secret: secret
          ws_url: ws://livekit:7880
          room_name: ingress-integration-${{ matrix.suite }}
          ${{ matrix.suite }}_only: true
          EOF

      - name: Run the ${{ matrix.suite }} suite
        env:
          INGRESS_TEST_CONFIG: /tmp/ingress-integration.yaml
          GSTVERSION: ${{ steps.gst-version.outputs.version }}
          SECURITY_REFRESH: ${{ github.run_id }}-${{ github.run_attempt }}
        # --build because run reuses whatever image already exists.
        run: docker compose -f build/test/compose.yaml run --build --rm test

      - name: Room server log
        if: failure()
        run: docker compose -f build/test/compose.yaml logs livekit
