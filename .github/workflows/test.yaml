name: Test
on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: namespace-profile-8vcpu-cache

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build docker image
        run: |
          docker build \
            -t ingress-test \
            -f ./build/test/Dockerfile \
            --build-arg SECURITY_REFRESH=${{ github.run_id }}-${{ github.run_attempt }} .

      - name: Run tests
        run: |
          docker run --rm \
            -e GITHUB_WORKFLOW=1 \
            ingress-test
