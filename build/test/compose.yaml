# The integration suite and the two services it needs. CI and a developer run
# the same three containers:
#
#   INGRESS_TEST_CONFIG=path/to/config.yaml \
#     docker compose -f build/test/compose.yaml run --rm test
#
# Redis carries this suite and nothing else. Any other service that registers
# an IOInfoServer on the same bus takes a share of the state updates, and the
# ingress under test then never reaches a terminal state. A separate Redis
# database would not help, since psrpc rides pub/sub and pub/sub is not scoped
# to one.

services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 2s
      retries: 30

  # Dev mode supplies the devkey/secret pair the config uses, so the suite
  # needs no credentials of its own. It also binds loopback only, hence the
  # explicit bind: without it the server answers itself and refuses every
  # other container. The healthcheck goes through the service name for the
  # same reason, since one on localhost passes while nothing can reach it.
  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://livekit:7880"]
      interval: 1s
      timeout: 2s
      retries: 30

  test:
    build:
      context: ../..
      dockerfile: build/test/Dockerfile
      args:
        SECURITY_REFRESH: ${SECURITY_REFRESH:-}
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_healthy
    environment:
      INTEGRATION: "1"
      GITHUB_WORKFLOW: ${GITHUB_WORKFLOW:-}
      INGRESS_CONFIG_FILE: /config/ingress.yaml
    volumes:
      - ${INGRESS_TEST_CONFIG:?point INGRESS_TEST_CONFIG at a test config}:/config/ingress.yaml:ro
